name: render page
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # every week on Sunday
    - cron: "0 0 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          pip install -r requirements.txt
          python scripts/render_citations.py --references-page chapters/literature.md
          python scripts/render_keywords.py
          zensical build
      # - uses: r-lib/actions/setup-r@v2
      #   with:
      #     r-version: 'renv'
      # - uses: r-lib/actions/setup-renv@v2
      # - run: |
      #     Rscript scripts/create_contributors_list.R
      #     Rscript scripts/create_zenodo_json.R
      # - name: Update Repo List
      #   uses: EndBug/add-and-commit@v9
      #   with:
      #     message: "Update contributors"
      #     add: "docs/contributor_list.md .zenodo.json"
      #     committer_name: "GitHub Actions"
      #     committer_email: "actions@github.com"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
